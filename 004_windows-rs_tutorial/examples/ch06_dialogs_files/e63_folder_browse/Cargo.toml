[package]
name = "e63_folder_browse"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies.windows]
workspace = true
# Constant-location trivia (grep the vendored bindings, never guess):
# SHBrowseForFolderW, BROWSEINFOW, BIF_* and SHGetPathFromIDListW all live
# in "shlobj_core" (not shellapi, where you'd expect them from the C
# headers), and CoTaskMemFree — used to free the returned pidl — is in
# "combaseapi".
features = ["winuser", "libloaderapi", "shlobj_core", "combaseapi"]
